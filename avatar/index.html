<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>头像原型 · 小白</title>
<style>
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}
body{font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;background:#1d1f22;color:#eee;max-width:520px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px}
header h1{font-size:17px;margin:0}header button{background:none;border:1px solid #555;color:#ccc;border-radius:14px;padding:3px 10px}
#stage{position:relative;overflow:hidden;background:#b9b9b9;aspect-ratio:1000/1100;width:100%}
#cv{width:100%;height:100%;display:block;transform-origin:50% 90%}
#sub{position:absolute;left:8px;right:8px;bottom:10px;text-align:center;font-size:16px;line-height:1.4;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000;min-height:1.4em}
#log{height:150px;overflow-y:auto;padding:8px 12px;font-size:14px}
.m{margin:4px 0;padding:6px 10px;border-radius:12px;max-width:85%;width:fit-content;word-break:break-all}
.u{background:#2f6fde;margin-left:auto}.b{background:#33363b}
form{display:flex;gap:6px;padding:8px 12px 16px}
#inp{flex:1;min-width:0;font-size:16px;padding:9px 12px;border-radius:20px;border:1px solid #444;background:#2a2c30;color:#eee}
form button{border:0;border-radius:20px;padding:0 14px;font-size:15px;background:#2f6fde;color:#fff}
#mic{background:#444}#mic.on{background:#d33}
#set{display:none;padding:8px 12px;background:#26282c;font-size:13px}#set.show{display:block}
#set label{display:block;margin:6px 0}#set input{width:100%;padding:6px;background:#1d1f22;color:#eee;border:1px solid #444;border-radius:6px}
</style></head><body>
<header><h1>小白 · 头像原型</h1><button id="setb">设置</button></header>
<div id="set">
<label>API Base URL（OpenAI 兼容，可选）<input id="sBase" placeholder="https://api.example.com/v1"></label>
<label>API Key（仅保存在本机 localStorage）<input id="sKey" type="password"></label>
<label>模型名<input id="sModel" placeholder="gpt-4o-mini"></label>
<button id="sSave">保存</button> <small>留空则使用本地规则回复</small></div>
<div id="stage"><canvas id="cv" width="1000" height="1100"></canvas><div id="sub"></div></div>
<div id="log"></div>
<form id="f"><button type="button" id="mic" title="语音输入">🎤</button><input id="inp" placeholder="和小白说点什么…" autocomplete="off"><button>发送</button></form>
<script>
// ===== 面部坐标（原图 1264x1568 像素，离线人工标定）=====
const OX=132,OY=150; // 画布裁剪偏移
const EYES=[{x:535,y:566,rx:58,ry:26},{x:765,y:563,rx:58,ry:26}];
const MOUTH={x:655,y:796,rx:92,top:745,bot:880};
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const img=new Image();img.src='face.jpg';
const off=document.createElement('canvas');off.width=300;off.height=260;const oc=off.getContext('2d');
let blink=0,mouth=0,mouthT=0,speaking=false,nextBlink=performance.now()+2000,blinkStart=-1,pulse=0;
window.avatar={force:null}; // 测试钩子 {blink:0..1,mouth:0..1}
const oe=document.createElement('canvas');oe.width=160;oe.height=110;const ec=oe.getContext('2d');
function drawEye(e,b){
  if(b<=0.02)return;
  const W=160,H=110,cx=80,cy=55,sx=e.x-cx,sy=e.y-cy,rx=e.rx,ry=e.ry;
  ec.clearRect(0,0,W,H);
  // 眼睑边缘曲线：张开时为上拱，闭合时为下弯
  const edgeY=x=>{const u=(x-cx)/rx;const arch=Math.max(0,1-u*u);return cy-ry+b*ry*1.9 - arch*ry*0.9*(1-b) + arch*6*b;};
  ec.beginPath();ec.moveTo(cx-rx-12,0);ec.lineTo(cx+rx+12,0);
  for(let x=cx+rx+12;x>=cx-rx-12;x-=4)ec.lineTo(x,edgeY(x));ec.closePath();ec.save();ec.clip();
  ec.drawImage(img,e.x-rx,e.y+36,rx*2,16,cx-rx-12,cy-ry-10,rx*2+24,ry*2+22); // 眼下皮肤
  const g=ec.createLinearGradient(0,cy-ry,0,cy+ry);g.addColorStop(0,'rgba(140,90,80,.28)');g.addColorStop(1,'rgba(100,60,50,.22)');ec.fillStyle=g;ec.fillRect(0,0,W,H);
  ec.restore();
  // 睫毛线（柔和）
  ec.strokeStyle='rgba(30,18,16,'+(0.25+0.6*b)+')';ec.lineWidth=2+2.5*b;ec.lineCap='round';ec.beginPath();
  for(let x=cx-rx*0.9;x<=cx+rx*0.9;x+=4){x===cx-rx*0.9?ec.moveTo(x,edgeY(x)):ec.lineTo(x,edgeY(x));}ec.stroke();
  // 羽化
  ec.globalCompositeOperation='destination-in';ec.save();ec.translate(cx,cy);ec.scale(1,0.62);
  const mg=ec.createRadialGradient(0,0,rx*0.7,0,0,rx*1.15);mg.addColorStop(0,'#000');mg.addColorStop(1,'rgba(0,0,0,0)');ec.fillStyle=mg;ec.fillRect(-W,-H*2,W*2,H*4);ec.restore();
  ec.globalCompositeOperation='source-over';
  ctx.drawImage(oe,sx,sy);
}
function drawMouth(o){
  if(o<=0.02)return;
  const M=MOUTH,W=300,H=260,sx=M.x-150,sy=M.top-40,seam=M.y-sy,t0=40;
  const up=o*5,dn=o*20,R=M.rx*1.2;
  oc.clearRect(0,0,W,H);oc.drawImage(img,sx,sy,W,H,0,0,W,H);
  // 口腔：沿唇缝的上下轮廓
  const prof=x=>{const u=(x-150)/R;return Math.max(0,1-u*u);};
  oc.beginPath();
  for(let x=0;x<=W;x+=3)oc.lineTo(x,seam-up*prof(x)*1.1);
  for(let x=W;x>=0;x-=3)oc.lineTo(x,seam+dn*Math.pow(prof(x),1.3)*0.9);
  oc.closePath();oc.save();oc.clip();
  const cyy=seam+dn*0.3,rg=oc.createRadialGradient(150,cyy,2,150,cyy,M.rx*0.8);
  rg.addColorStop(0,'#1e0809');rg.addColorStop(.6,'#3d1416');rg.addColorStop(1,'#6e3030');oc.fillStyle=rg;oc.fillRect(0,0,W,H);
  if(o>0.4){oc.fillStyle='rgba(225,212,200,'+Math.min(.55,(o-.4)*1.2)+')';oc.beginPath();oc.ellipse(150,seam-up*0.9,M.rx*0.42,4+3*o,0,0,Math.PI);oc.fill();}
  oc.restore();
  // 逐列位移上唇/下唇+下巴
  for(let x=0;x<W;x+=2){const f=prof(x+1);if(f<=0)continue;const u=up*f,d=dn*Math.pow(f,1.3);
    oc.drawImage(img,sx+x,sy+t0,2,seam-t0,x,t0,2,seam-t0-u);
    oc.drawImage(img,sx+x,sy+seam,2,H-seam,x,seam+d,2,H-seam-d);}
  // 羽化
  oc.globalCompositeOperation='destination-in';oc.save();oc.translate(150,seam+15);oc.scale(1,0.85);
  const mg=oc.createRadialGradient(0,0,70,0,0,145);mg.addColorStop(0,'#000');mg.addColorStop(1,'rgba(0,0,0,0)');oc.fillStyle=mg;oc.fillRect(-W,-H*2,W*2,H*4);oc.restore();
  oc.globalCompositeOperation='source-over';ctx.drawImage(off,sx,sy);
}
function frame(t){
  requestAnimationFrame(frame);if(!img.complete)return;
  // 眨眼
  if(t>nextBlink){blinkStart=t;nextBlink=t+2500+Math.random()*4000;if(Math.random()<.2)nextBlink=t+350;}
  if(blinkStart>=0){const d=(t-blinkStart)/150;blink=d<1?d:d<2.2?Math.max(0,1-(d-1)/1.2):0;if(d>=2.2)blinkStart=-1;}
  // 嘴型
  let target=0;
  if(speaking){mouthT+=1;target=0.25+0.35*Math.abs(Math.sin(t/95))+0.25*Math.abs(Math.sin(t/57+1))+pulse;pulse*=0.9;target=Math.min(1,target);}
  mouth+=(target-mouth)*0.35;
  let b=blink,m=mouth;if(avatar.force){if(avatar.force.blink!=null)b=avatar.force.blink;if(avatar.force.mouth!=null)m=avatar.force.mouth;}
  ctx.setTransform(1,0,0,1,-OX,-OY);ctx.drawImage(img,0,0);
  drawMouth(m);EYES.forEach(e=>drawEye(e,b));
  // 呼吸+轻微摆头（CSS 变换）
  const s=1+0.006*Math.sin(t/1100),ty=1.5*Math.sin(t/1100),r=0.5*Math.sin(t/2700)+0.25*Math.sin(t/1700);
  cv.style.transform=`translateY(${ty}px) scale(${s}) rotate(${r}deg)`;
}
requestAnimationFrame(frame);

// ===== 回复：getReply(text) 为唯一入口，可替换为任意 LLM =====
const S={get:k=>localStorage.getItem('avatar_'+k)||'',set:(k,v)=>localStorage.setItem('avatar_'+k,v)};
async function getReply(text){
  const base=S.get('base'),key=S.get('key');
  if(base&&key){
    try{const r=await fetch(base.replace(/\/$/,'')+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model:S.get('model')||'gpt-4o-mini',messages:[{role:'system',content:'你是小白，一个温柔、简洁的中文虚拟助手，每次回答不超过60字。'},{role:'user',content:text}]})});
      const j=await r.json();return j.choices[0].message.content.trim();}catch(e){return '连接模型失败了，我先用本地模式回答：'+localReply(text);}
  }
  return localReply(text);
}
function localReply(t){
  const now=new Date();
  const rules=[
    [/你好|您好|嗨|hi|hello|哈喽/i,()=>pick(['你好呀，我是小白，很高兴见到你！','嗨～今天过得怎么样？'])],
    [/名字|你是谁|叫什么/,()=>'我叫小白，是一个头像原型，正在学习和你聊天。'],
    [/几点|时间/,()=>`现在是${now.getHours()}点${now.getMinutes()}分。`],
    [/日期|几号|星期|礼拜/,()=>`今天是${now.getMonth()+1}月${now.getDate()}日，星期${'日一二三四五六'[now.getDay()]}。`],
    [/天气/,()=>'我还看不到窗外呢，不过希望你那边是好天气。'],
    [/谢谢|感谢/,()=>'不客气，随时找我聊天～'],
    [/再见|拜拜|晚安/,()=>'好的，再见啦，祝你一切顺利！'],
    [/累|难过|不开心|烦/,()=>'辛苦了，先深呼吸一下，想聊聊发生了什么吗？'],
    [/喜欢|爱好/,()=>'我喜欢听别人讲故事，你最近有什么有趣的事吗？'],
    [/吃|饭/,()=>'记得按时吃饭哦，你今天吃了什么？'],
    [/笑话/,()=>'有一天，0对8说：胖就胖呗，系什么腰带呀。'],
  ];
  for(const [re,f] of rules)if(re.test(t))return f();
  return pick(['嗯嗯，我在听，可以再多说一点吗？','这个问题有意思，我还在学习中呢。','原来是这样呀，然后呢？']);
}
function pick(a){return a[Math.floor(Math.random()*a.length)]}

// ===== 说话 =====
const sub=document.getElementById('sub');let voice=null;
function loadVoice(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;}
if('speechSynthesis' in window){loadVoice();speechSynthesis.onvoiceschanged=loadVoice;}
let fallbackTimer=null;
function speak(text){
  sub.textContent=text;speaking=true;clearTimeout(fallbackTimer);
  const est=Math.max(1200,text.length*230);
  const done=()=>{speaking=false;clearTimeout(fallbackTimer);setTimeout(()=>{if(!speaking)sub.textContent=''},2500);};
  if(!('speechSynthesis' in window)){fallbackTimer=setTimeout(done,est);return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';if(voice)u.voice=voice;u.rate=1.05;u.pitch=1.15;
  u.onboundary=()=>{pulse=0.3};u.onend=done;u.onerror=()=>{fallbackTimer=setTimeout(done,est)};
  speechSynthesis.speak(u);
  fallbackTimer=setTimeout(done,est*2.5+1500); // 保险：无语音引擎时也会停止
}
// ===== 聊天 UI =====
const log=document.getElementById('log'),inp=document.getElementById('inp');
function add(t,c){const d=document.createElement('div');d.className='m '+c;d.textContent=t;log.appendChild(d);log.scrollTop=1e9;}
async function send(t){t=t.trim();if(!t)return;add(t,'u');inp.value='';const r=await getReply(t);add(r,'b');speak(r);}
document.getElementById('f').onsubmit=e=>{e.preventDefault();send(inp.value)};
// 设置
const set=document.getElementById('set');
document.getElementById('setb').onclick=()=>set.classList.toggle('show');
['base','key','model'].forEach(k=>document.getElementById('s'+k[0].toUpperCase()+k.slice(1)).value=S.get(k));
document.getElementById('sSave').onclick=()=>{['base','key','model'].forEach(k=>S.set(k,document.getElementById('s'+k[0].toUpperCase()+k.slice(1)).value.trim()));set.classList.remove('show');add('设置已保存（仅本机）','b');};
// 语音输入
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,mic=document.getElementById('mic');
if(!SR)mic.style.display='none';else{let rec=null;mic.onclick=()=>{if(rec){rec.stop();return;}
  rec=new SR();rec.lang='zh-CN';rec.interimResults=false;mic.classList.add('on');
  rec.onresult=e=>send(e.results[0][0].transcript);rec.onend=()=>{rec=null;mic.classList.remove('on')};rec.start();};}
add('你好，我是小白。打字或点麦克风和我聊天吧～','b');
</script></body></html>
