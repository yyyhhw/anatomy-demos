<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>暗影行动 · FPS</title>
<style>
  :root{
    --ink:#e8e6df;--dim:rgba(232,230,223,.55);--accent:#ffb347;--red:#ff3b30;--green:#7ee081;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    --gap:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;font-family:var(--sans);color:var(--ink);user-select:none;-webkit-user-select:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none}
  #hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .4s}
  #hud.on{opacity:1}

  /* 瞄准十字 */
  #cross{position:absolute;left:50%;top:50%;width:0;height:0}
  #cross i{position:absolute;background:#fff;box-shadow:0 0 2px #000,0 0 1px #000;transition:transform .06s}
  #cross .t,#cross .b{width:2px;height:9px;left:-1px}
  #cross .l,#cross .r{height:2px;width:9px;top:-1px}
  #cross .t{top:calc(-9px - var(--gap))}
  #cross .b{top:var(--gap)}
  #cross .l{left:calc(-9px - var(--gap))}
  #cross .r{left:var(--gap)}
  #cross .dot{width:2px;height:2px;left:-1px;top:-1px;border-radius:1px}
  #cross.ads i{opacity:0}
  #cross.ads .dot{opacity:1}
  #hit{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0}
  #hit i{position:absolute;left:50%;top:50%;width:2px;height:12px;margin:-6px 0 0 -1px;background:#fff;box-shadow:0 0 2px #000}
  #hit i:nth-child(1){transform:translate(-7px,-7px) rotate(45deg)}
  #hit i:nth-child(2){transform:translate(7px,-7px) rotate(-45deg)}
  #hit i:nth-child(3){transform:translate(-7px,7px) rotate(-45deg)}
  #hit i:nth-child(4){transform:translate(7px,7px) rotate(45deg)}
  #hit.kill i{background:var(--red)}

  /* 伤害与低血量 */
  #vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(140,0,0,.9) 100%);opacity:0}
  #dmg{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,40,20,.0) 30%,rgba(255,40,20,.55) 100%);opacity:0}
  #flash{position:absolute;inset:0;background:#fff;opacity:0}

  /* 罗盘 */
  #compass{position:absolute;top:18px;left:50%;width:420px;margin-left:-210px;height:34px;overflow:hidden;background:rgba(0,0,0,.28);
    mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}
  #strip{position:absolute;top:0;left:0;height:100%;white-space:nowrap}
  #strip span{position:absolute;top:4px;font:12px var(--mono);color:var(--dim);transform:translateX(-50%)}
  #strip span.cd{color:var(--ink);font-weight:700;font-size:14px;top:2px}
  #strip b{position:absolute;top:22px;width:1px;height:6px;background:var(--dim)}
  #strip b.big{height:10px;top:20px;background:var(--ink)}
  #compass .pin{position:absolute;left:50%;bottom:0;width:0;height:0;border:5px solid transparent;border-bottom-color:var(--accent);margin-left:-5px}
  #enemies{position:absolute;top:56px;left:50%;transform:translateX(-50%);font:11px var(--mono);color:var(--dim);letter-spacing:.2em}

  /* 左上信息 */
  #tl{position:absolute;left:28px;top:24px;font:13px var(--mono);line-height:1.8;text-shadow:0 1px 2px #000}
  #tl .wave{font:700 22px var(--sans);letter-spacing:.08em;color:var(--accent)}
  #tl .lbl{color:var(--dim)}
  /* 击杀记录 */
  #feed{position:absolute;right:28px;top:60px;text-align:right;font:13px var(--mono);text-shadow:0 1px 2px #000}
  #feed div{opacity:0;animation:feed 4s forwards;margin-bottom:4px}
  #feed div em{color:var(--accent);font-style:normal}
  @keyframes feed{0%{opacity:0;transform:translateX(12px)}8%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
  #fps{position:absolute;right:28px;top:24px;font:11px var(--mono);color:var(--dim)}

  /* 左下 生命 */
  #bl{position:absolute;left:28px;bottom:28px;text-shadow:0 1px 2px #000}
  #hpbar{width:240px;height:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);position:relative;overflow:hidden}
  #hpfill{height:100%;width:100%;background:linear-gradient(90deg,#9fe3a2,#4ec25a);transition:width .15s,background .3s}
  #hpfill.low{background:linear-gradient(90deg,#ff7b6e,#e3261a)}
  #hptxt{font:700 26px var(--mono);margin-top:6px;letter-spacing:.05em}
  #hptxt small{font-size:12px;color:var(--dim);margin-left:6px;font-weight:400}
  #gren{font:14px var(--mono);color:var(--dim);margin-top:4px}
  #gren b{color:var(--accent);letter-spacing:.2em}

  /* 右下 弹药 */
  #br{position:absolute;right:28px;bottom:28px;text-align:right;text-shadow:0 1px 2px #000}
  #ammo{font:700 46px var(--mono);line-height:1;letter-spacing:-.02em}
  #ammo small{font-size:18px;color:var(--dim);font-weight:400}
  #ammo.low{color:var(--red)}
  #wname{font:13px var(--sans);color:var(--dim);letter-spacing:.2em;margin-top:6px}
  #keys{font:11px var(--mono);color:var(--dim);margin-top:6px;opacity:.7}

  /* 中央横幅与提示 */
  #banner{position:absolute;left:0;right:0;top:30%;text-align:center;font:700 40px var(--sans);letter-spacing:.3em;color:var(--accent);text-shadow:0 2px 12px #000;opacity:0;transition:opacity .4s}
  #banner small{display:block;font:13px var(--mono);letter-spacing:.3em;color:var(--dim);margin-top:8px}
  #prompt{position:absolute;left:0;right:0;top:58%;text-align:center;font:700 15px var(--mono);letter-spacing:.2em;color:var(--accent);text-shadow:0 1px 3px #000;opacity:0}
  #prompt.on{opacity:1}
  #reloadbar{position:absolute;left:50%;top:calc(50% + 26px);width:60px;height:3px;margin-left:-30px;background:rgba(255,255,255,.15);display:none}
  #reloadbar i{display:block;height:100%;background:#fff;width:0}

  /* 菜单 */
  #menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:20px 0;background:radial-gradient(ellipse at 50% 40%,rgba(30,34,44,.55),rgba(0,0,0,.92));backdrop-filter:blur(2px);z-index:10;transition:opacity .4s}
  #menu.hide{opacity:0;pointer-events:none}
  .card{width:min(560px,92vw);margin:auto;padding:40px 44px;border:1px solid rgba(255,255,255,.1);background:rgba(10,12,16,.75);box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .card h1{font:800 42px var(--sans);letter-spacing:.25em;margin-bottom:4px}
  .card .sub{font:12px var(--mono);letter-spacing:.3em;color:var(--accent);margin-bottom:28px}
  .card p.desc{font:14px/1.7 var(--sans);color:var(--dim);margin-bottom:22px}
  .keys{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px;font:13px var(--mono);color:var(--dim);margin-bottom:28px}
  .keys b{display:inline-block;min-width:74px;color:var(--ink);font-weight:600}
  .btn{pointer-events:auto;cursor:pointer;font:700 15px var(--sans);letter-spacing:.3em;padding:14px 28px;border:1px solid var(--accent);background:var(--accent);color:#1a1200;transition:transform .1s,background .2s}
  .btn:hover{background:#ffc66b;transform:translateY(-1px)}
  .btn.ghost{background:transparent;color:var(--accent);margin-left:12px}
  .hint{font:11px var(--mono);color:var(--dim);margin-top:18px}
  #stats{font:14px var(--mono);line-height:2;color:var(--dim);margin-bottom:24px}
  #stats b{color:var(--ink)}
  #err{color:#ff8a80;font:13px var(--mono);margin-top:14px;display:none}
  @media (max-width:640px){#compass{width:260px;margin-left:-130px}#ammo{font-size:34px}.card{padding:28px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="vig"></div><div id="dmg"></div><div id="flash"></div>
  <div id="compass"><div id="strip"></div><div class="pin"></div></div>
  <div id="enemies">敌军 0</div>
  <div id="cross"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="dot"></i></div>
  <div id="hit"><i></i><i></i><i></i><i></i></div>
  <div id="reloadbar"><i></i></div>
  <div id="tl"><div class="wave">第 1 波</div><div><span class="lbl">分数 </span><span id="score">0</span></div><div><span class="lbl">击杀 </span><span id="kills">0</span></div><div><span class="lbl">光照 </span><span id="tod">正午</span></div></div>
  <div id="fps"></div>
  <div id="feed"></div>
  <div id="bl"><div id="hpbar"><div id="hpfill"></div></div><div id="hptxt">100<small>HP</small></div><div id="gren">手雷 <b>●●●</b></div></div>
  <div id="br"><div id="ammo"><span id="mag">30</span> <small>/ <span id="res">120</span></small></div><div id="wname">M4A1 · 全自动</div><div id="keys">[F] 手电 &nbsp;[T] 时间 &nbsp;[G] 手雷 &nbsp;[R] 装弹</div></div>
  <div id="banner"></div>
  <div id="prompt"></div>
</div>

<div id="menu">
  <div class="card">
    <h1>暗影行动</h1>
    <div class="sub">SHADOW OPS · 第一人称射击演示</div>
    <p class="desc" id="desc">实时阴影 · 动态昼夜光照 · 枪口闪光投影 · 战术手电 · 波次敌军 AI。<br>守住补给站，尽可能多地击退来袭敌军。</p>
    <div id="stats" style="display:none"></div>
    <div class="keys">
      <div><b>W A S D</b> 移动</div><div><b>鼠标</b> 视角</div>
      <div><b>左键</b> 射击</div><div><b>右键</b> 机瞄</div>
      <div><b>Shift</b> 冲刺</div><div><b>空格</b> 跳跃</div>
      <div><b>C</b> 蹲下</div><div><b>R</b> 装弹</div>
      <div><b>G</b> 手雷</div><div><b>F</b> 手电</div>
      <div><b>T</b> 切换时间</div><div><b>Esc</b> 暂停</div>
    </div>
    <button class="btn" id="start">开始任务</button>
    <p class="hint" id="hint">点击后锁定鼠标指针，按 Esc 暂停</p>
    <div id="err"></div>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js"}}
</script>
<script type="module">
let THREE;
try { THREE = await import('three'); }
catch (e) {
  const el = document.getElementById('err'); el.style.display = 'block';
  el.textContent = '无法加载 Three.js（需要网络访问 cdnjs.cloudflare.com）：' + e.message;
  document.getElementById('start').disabled = true;
  throw e;
}

// ============================================================
//  基础渲染
// ============================================================
const $ = id => document.getElementById(id);
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xb9cfe3, 0.006);
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 420);
camera.rotation.order = 'YXZ';
scene.add(camera);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

// ============================================================
//  程序化贴图
// ============================================================
function makeTex(draw, size = 256) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const g = cv.getContext('2d'); draw(g, size);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
function grain(g, s, base, amp, n) {
  for (let i = 0; i < n; i++) {
    const v = Math.round(base + (Math.random() - .5) * amp);
    g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(Math.random() * s, Math.random() * s, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
}
const TEX = {
  asphalt: makeTex((g, s) => {
    g.fillStyle = '#5c5d5b'; g.fillRect(0, 0, s, s); grain(g, s, 92, 70, 9000);
    g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 1.2;
    for (let i = 0; i < 5; i++) { g.beginPath(); let x = rnd(s), y = rnd(s); g.moveTo(x, y); for (let k = 0; k < 6; k++) { x += rnd(-40, 40); y += rnd(-40, 40); g.lineTo(x, y); } g.stroke(); }
  }),
  concrete: makeTex((g, s) => {
    g.fillStyle = '#9a9890'; g.fillRect(0, 0, s, s); grain(g, s, 150, 50, 7000);
    g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(0, 0, s, 3); g.fillRect(0, 0, 3, s);
    g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(0, s - 2, s, 2);
    for (let i = 0; i < 12; i++) { g.fillStyle = `rgba(0,0,0,${rnd(.05, .18)})`; g.fillRect(rnd(s), rnd(s), rnd(6, 30), rnd(6, 30)); }
  }),
  brick: makeTex((g, s) => {
    g.fillStyle = '#6e6259'; g.fillRect(0, 0, s, s);
    const bh = s / 8, bw = s / 4;
    for (let r = 0; r < 8; r++) for (let c = -1; c < 5; c++) {
      const off = (r % 2) * bw / 2; const v = rnd(-18, 18);
      g.fillStyle = `rgb(${138 + v},${74 + v * .6},${58 + v * .5})`;
      g.fillRect(c * bw + off + 2, r * bh + 2, bw - 4, bh - 4);
    }
    grain(g, s, 110, 60, 2500);
  }),
  plank: makeTex((g, s) => {
    g.fillStyle = '#7a5a36'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 6; i++) {
      const v = rnd(-16, 16); g.fillStyle = `rgb(${150 + v},${105 + v},${62 + v})`; g.fillRect(0, i * s / 6 + 1, s, s / 6 - 2);
      g.strokeStyle = 'rgba(60,35,10,.5)'; g.lineWidth = 1;
      for (let k = 0; k < 4; k++) { g.beginPath(); const y = i * s / 6 + rnd(4, s / 6 - 4); g.moveTo(0, y); g.bezierCurveTo(s * .3, y + rnd(-4, 4), s * .7, y + rnd(-4, 4), s, y); g.stroke(); }
    }
    g.fillStyle = 'rgba(0,0,0,.4)'; g.fillRect(0, 0, s, 4); g.fillRect(0, s - 4, s, 4); g.fillRect(0, 0, 4, s); g.fillRect(s - 4, 0, 4, s);
    g.fillStyle = '#3a2a18'; [[14, 14], [s - 18, 14], [14, s - 18], [s - 18, s - 18]].forEach(([x, y]) => { g.beginPath(); g.arc(x + 2, y + 2, 3, 0, 7); g.fill(); });
  }),
  metal: makeTex((g, s) => {
    g.fillStyle = '#3f5560'; g.fillRect(0, 0, s, s); grain(g, s, 80, 40, 4000);
    for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? 'rgba(0,0,0,.25)' : 'rgba(255,255,255,.08)'; g.fillRect(i * s / 8, 0, 3, s); }
    for (let i = 0; i < 25; i++) { g.fillStyle = `rgba(120,70,30,${rnd(.1, .5)})`; g.fillRect(rnd(s), rnd(s), rnd(3, 14), rnd(3, 30)); }
  }),
  sand: makeTex((g, s) => { g.fillStyle = '#9c8a62'; g.fillRect(0, 0, s, s); grain(g, s, 140, 50, 6000); g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(0, s / 2 - 2, s, 4); }),
  flash: (() => {
    const cv = document.createElement('canvas'); cv.width = cv.height = 128; const g = cv.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, 'rgba(255,255,230,1)'); gr.addColorStop(.25, 'rgba(255,200,90,.9)'); gr.addColorStop(.6, 'rgba(255,120,30,.25)'); gr.addColorStop(1, 'rgba(255,80,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    g.strokeStyle = 'rgba(255,230,150,.8)'; g.lineWidth = 3;
    for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2; g.beginPath(); g.moveTo(64, 64); g.lineTo(64 + Math.cos(a) * 62, 64 + Math.sin(a) * 62); g.stroke(); }
    const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
  })(),
  hole: (() => {
    const cv = document.createElement('canvas'); cv.width = cv.height = 64; const g = cv.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(10,10,10,1)'); gr.addColorStop(.4, 'rgba(20,20,20,.9)'); gr.addColorStop(.7, 'rgba(40,40,40,.35)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    const t = new THREE.CanvasTexture(cv); return t;
  })(),
};

// 带贴图重复的材质缓存（按面尺寸）
const matCache = new Map();
function texMat(kind, rx, ry, extra = {}) {
  rx = Math.max(1, Math.round(rx)); ry = Math.max(1, Math.round(ry));
  const key = kind + rx + 'x' + ry;
  if (matCache.has(key)) return matCache.get(key);
  const t = TEX[kind].clone(); t.repeat.set(rx, ry); t.needsUpdate = true;
  const rough = { asphalt: .96, concrete: .9, brick: .92, plank: .85, metal: .5, sand: .95 }[kind];
  const m = new THREE.MeshStandardMaterial({ map: t, roughness: rough, metalness: kind === 'metal' ? .55 : 0, ...extra });
  matCache.set(key, m); return m;
}

// ============================================================
//  世界 / 关卡
// ============================================================
const world = { boxes: [], meshes: [] };       // 碰撞盒 & 可被射线击中的网格
const SCALE = 2; // 每 2 米重复一次贴图

function addBox(x, y, z, w, h, d, kind, { solid = true, shadow = true } = {}) {
  const geo = new THREE.BoxGeometry(w, h, d);
  let mat;
  if (typeof kind === 'string') {
    mat = [texMat(kind, d / SCALE, h / SCALE), texMat(kind, d / SCALE, h / SCALE),
           texMat(kind, w / SCALE, d / SCALE), texMat(kind, w / SCALE, d / SCALE),
           texMat(kind, w / SCALE, h / SCALE), texMat(kind, w / SCALE, h / SCALE)];
  } else mat = kind;
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y + h / 2, z);
  m.castShadow = shadow; m.receiveShadow = true;
  scene.add(m); world.meshes.push(m);
  if (solid) world.boxes.push({ min: V3(x - w / 2, y, z - d / 2), max: V3(x + w / 2, y + h, z + d / 2) });
  return m;
}
function addCyl(x, y, z, r, h, mat) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 16), mat);
  m.position.set(x, y + h / 2, z); m.castShadow = m.receiveShadow = true;
  scene.add(m); world.meshes.push(m);
  world.boxes.push({ min: V3(x - r, y, z - r), max: V3(x + r, y + h, z + r) });
  return m;
}

// 地面
{
  const g = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), texMat('asphalt', 60, 60));
  g.rotation.x = -Math.PI / 2; g.receiveShadow = true; scene.add(g); world.meshes.push(g);
  // 中央广场铺装
  const p = new THREE.Mesh(new THREE.PlaneGeometry(26, 26), texMat('concrete', 10, 10));
  p.rotation.x = -Math.PI / 2; p.position.y = .01; p.receiveShadow = true; scene.add(p); world.meshes.push(p);
}
// 外墙
const ARENA = 45;
addBox(0, 0, -ARENA, ARENA * 2 + 1, 6, 1, 'brick'); addBox(0, 0, ARENA, ARENA * 2 + 1, 6, 1, 'brick');
addBox(-ARENA, 0, 0, 1, 6, ARENA * 2 + 1, 'brick'); addBox(ARENA, 0, 0, 1, 6, ARENA * 2 + 1, 'brick');

// 建筑
addBox(-18, 0, -10, 14, 7, 12, 'concrete');  addBox(-18, 7, -10, 14.6, .5, 12.6, 'concrete');   // 带檐口
addBox(-18, 0, -3.2, 6, 3.5, 1.6, 'concrete');                                                 // 门厅

function collides(pos, radius, height) {
  const step = pos.y + .5;
  for (const b of world.boxes) {
    if (b.max.y <= step || b.min.y >= pos.y + height) continue;
    if (pos.x + radius > b.min.x && pos.x - radius < b.max.x && pos.z + radius > b.min.z && pos.z - radius < b.max.z) return b;
  }
  return null;
}
function floorAt(pos, radius) {
  let f = 0;
  for (const b of world.boxes) {
    if (b.max.y > pos.y + .55) continue;
    if (pos.x + radius * .6 > b.min.x && pos.x - radius * .6 < b.max.x && pos.z + radius * .6 > b.min.z && pos.z - radius * .6 < b.max.z) f = Math.max(f, b.max.y);
  }
  return f;
}
function moveBody(pos, vel, dt, radius, height) {
  const nx = pos.x + vel.x * dt;
  if (!collides(V3(nx, pos.y, pos.z), radius, height)) pos.x = nx; else vel.x = 0;
  const nz = pos.z + vel.z * dt;
  if (!collides(V3(pos.x, pos.y, nz), radius, height)) pos.z = nz; else vel.z = 0;
}

    if (hitP) damagePlayer(Math.round(rnd(7, 13)), mz);
    else {
      // 擦过：在玩家附近打出火花
      const dir = target.clone().sub(mz).normalize(); raycaster.set(mz, dir); raycaster.far = 120;
      const hs = raycaster.intersectObjects(world.meshes, false); if (hs[0]) impact(hs[0].point, hs[0].face.normal.clone().transformDirection(hs[0].object.matrixWorld));
    }
    sfx.shot(.35, dist);
  }
}

// ============================================================
//  波次 / 状态
// ============================================================
const state = { wave: 0, kills: 0, score: 0, waveKills: 0, toSpawn: 0, spawnT: 0, waveClear: false, clearT: 0 };
function startWave() {
  state.wave++; state.waveKills = 0; state.waveClear = false;
  state.toSpawn = Math.min(16, 3 + state.wave * 2); state.spawnT = 1.5;
  banner(`第 ${state.wave} 波`, '敌军来袭');
  $('tl').firstElementChild.textContent = `第 ${state.wave} 波`;
  if (state.wave > 1) { G.reserve += 60; G.grenades = Math.min(3, G.grenades + 1); $('gren').firstElementChild.textContent = '●'.repeat(G.grenades) + '○'.repeat(3 - G.grenades); }
}
function spawnEnemy() {
  const cands = spawnPoints.filter(([x, z]) => Math.hypot(x - P.pos.x, z - P.pos.z) > 24);
  const [x, z] = cands[Math.floor(rnd(cands.length))] || spawnPoints[0];
  enemies.push(new Enemy(x + rnd(-2, 2), z + rnd(-2, 2), state.wave));
}
function updateWaves(dt) {
  const alive = enemies.filter(e => e.alive).length;
  if (state.toSpawn > 0 && alive < Math.min(9, 4 + state.wave)) { state.spawnT -= dt; if (state.spawnT <= 0) { state.spawnT = rnd(.6, 1.6); state.toSpawn--; spawnEnemy(); } }
  if (state.toSpawn === 0 && alive === 0 && !state.waveClear) { state.waveClear = true; state.clearT = 4; banner(`第 ${state.wave} 波 已清除`, '补给已送达 · +60 弹药'); sfx.clear(); }
  if (state.waveClear) { state.clearT -= dt; if (state.clearT <= 0) startWave(); }
  $('enemies').textContent = `敌军 ${alive + state.toSpawn}`;
}

function damagePlayer(dmg, from) {
  if (!P.alive) return;
  P.hp -= dmg; P.lastHit = now; dmgFlash = 1; P.shake = Math.min(1, P.shake + .18);
  sfx.hurt();
  if (P.hp <= 0) { P.hp = 0; die(); }
}
function die() {
  P.alive = false; mouse.left = false;
  setTimeout(() => {
    running = false; document.exitPointerLock?.();
    $('menu').classList.remove('hide');
    $('desc').style.display = 'none'; $('stats').style.display = 'block';
    $('stats').innerHTML = `任务失败<br>生存至 <b>第 ${state.wave} 波</b> · 击杀 <b>${state.kills}</b> · 分数 <b>${state.score}</b>`;
    $('start').textContent = '重新部署'; $('hint').textContent = '点击重新开始';
  }, 1400);
}
function resetGame() {
  for (const e of enemies) scene.remove(e.group); enemies.length = 0; enemyMeshCache = null;
  for (const g of grenades) scene.remove(g.m); grenades.length = 0;
  Object.assign(P, { hp: 100, alive: true, vy: 0, yaw: 0, pitch: 0, crouch: false, recoil: 0, recoilX: 0, shake: 0 }); P.pos.set(0, 0, 30); P.hvel.set(0, 0, 0);
  Object.assign(G, { mag: 30, reserve: 120, reloading: false, grenades: 3, ads: 0 }); $('reloadbar').style.display = 'none';
  Object.assign(state, { wave: 0, kills: 0, score: 0, toSpawn: 0, waveClear: false });
  $('gren').firstElementChild.textContent = '●●●'; $('feed').innerHTML = '';
  startWave();
}

// ============================================================
//  HUD
// ============================================================
let dmgFlash = 0, hitT = 0, bannerT = 0, promptT = 0;
function hitmarker(kill) { hitT = .14; $('hit').className = kill ? 'kill' : ''; $('hit').style.opacity = 1; if (kill) sfx.kill(); }
function feed(html) { const d = document.createElement('div'); d.innerHTML = html; $('feed').prepend(d); while ($('feed').children.length > 5) $('feed').lastChild.remove(); setTimeout(() => d.remove(), 4000); }
function banner(t, s) { $('banner').innerHTML = t + (s ? `<small>${s}</small>` : ''); $('banner').style.opacity = 1; bannerT = 3; }
function prompt(t) { $('prompt').textContent = t; $('prompt').classList.add('on'); promptT = 2; }
// 罗盘刻度
{
  const strip = $('strip'); const names = { 0: 'N', 45: 'NE', 90: 'E', 135: 'SE', 180: 'S', 225: 'SW', 270: 'W', 315: 'NW' };
  for (let d = -360; d <= 720; d += 15) {
    const x = (d + 360) * 4; const n = ((d % 360) + 360) % 360;
    if (n % 45 === 0) { const s = document.createElement('span'); s.className = 'cd'; s.textContent = names[n]; s.style.left = x + 'px'; strip.appendChild(s); const b = document.createElement('b'); b.className = 'big'; b.style.left = x + 'px'; strip.appendChild(b); }
    else { const b = document.createElement('b'); b.style.left = x + 'px'; strip.appendChild(b); if (n % 30 === 0) { const s = document.createElement('span'); s.textContent = n; s.style.left = x + 'px'; strip.appendChild(s); } }
  }
}
let fpsAcc = 0, fpsN = 0;
function updateHUD(dt) {
  const heading = ((-P.yaw * 180 / Math.PI) % 360 + 360) % 360;
  $('strip').style.transform = `translateX(${$('compass').clientWidth / 2 - (heading + 360) * 4}px)`;
  const sp = Math.hypot(P.hvel.x, P.hvel.z);
  const gap = lerp(6 + sp * 1.6 + (P.onGround ? 0 : 10) + P.recoil * 300, 2, G.ads) * (P.crouch ? .75 : 1);
  document.documentElement.style.setProperty('--gap', gap + 'px');
  $('cross').className = G.ads > .6 ? 'ads' : '';
  if (hitT > 0) { hitT -= dt; if (hitT <= 0) $('hit').style.opacity = 0; }
  $('mag').textContent = G.mag; $('res').textContent = G.reserve; $('ammo').className = G.mag <= 6 ? 'low' : '';
  $('hpfill').style.width = P.hp + '%'; $('hpfill').className = P.hp < 35 ? 'low' : ''; $('hptxt').innerHTML = Math.ceil(P.hp) + '<small>HP</small>';
  $('score').textContent = state.score; $('kills').textContent = state.kills;
  dmgFlash = Math.max(0, dmgFlash - dt * 2.2); $('dmg').style.opacity = dmgFlash;
  const low = clamp(1 - P.hp / 60, 0, 1); $('vig').style.opacity = low * low * (.6 + .4 * Math.sin(now * 6)) + (P.alive ? 0 : .8);
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').style.opacity = 0; }
  if (promptT > 0) { promptT -= dt; if (promptT <= 0) $('prompt').classList.remove('on'); }
  fpsN++; const pn = performance.now(); if (pn - fpsAcc > 500) { $('fps').textContent = Math.round(fpsN * 1000 / (pn - fpsAcc)) + ' FPS'; fpsAcc = pn; fpsN = 0; }
}

// ============================================================
//  音效（WebAudio 合成）
// ============================================================
let actx = null;
function noiseBuf(len) { const b = actx.createBuffer(1, actx.sampleRate * len, actx.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; }
let nbuf;
const sfx = {
  env(gain, t0, peak, dur) { gain.gain.setValueAtTime(0.0001, t0); gain.gain.exponentialRampToValueAtTime(peak, t0 + .004); gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); },
  shot(vol = 1, dist = 0) {
    if (!actx) return; const t = actx.currentTime, g = actx.createGain(); g.connect(actx.destination);
    const v = vol * clamp(1 - dist / 70, .1, 1);
    const n = actx.createBufferSource(); n.buffer = nbuf; const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(3500, t); f.frequency.exponentialRampToValueAtTime(300, t + .12);
    n.connect(f).connect(g); this.env(g, t, .55 * v, .16); n.start(t); n.stop(t + .2);
    const o = actx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + .09);
    const g2 = actx.createGain(); o.connect(g2).connect(actx.destination); this.env(g2, t, .5 * v, .1); o.start(t); o.stop(t + .12);
  },
  impact() { if (!actx) return; const t = actx.currentTime; const n = actx.createBufferSource(); n.buffer = nbuf; const f = actx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2500; const g = actx.createGain(); n.connect(f).connect(g).connect(actx.destination); this.env(g, t, .12, .05); n.start(t); n.stop(t + .06); },
  hit() { if (!actx) return; const t = actx.currentTime; const o = actx.createOscillator(); o.type = 'square'; o.frequency.value = 1800; const g = actx.createGain(); o.connect(g).connect(actx.destination); this.env(g, t, .08, .04); o.start(t); o.stop(t + .05); },
  kill() { if (!actx) return; const t = actx.currentTime; [880, 1320].forEach((fr, i) => { const o = actx.createOscillator(); o.type = 'triangle'; o.frequency.value = fr; const g = actx.createGain(); o.connect(g).connect(actx.destination); this.env(g, t + i * .05, .12, .12); o.start(t + i * .05); o.stop(t + i * .05 + .14); }); },
  hurt() { if (!actx) return; const t = actx.currentTime; const o = actx.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(90, t + .2); const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 600; const g = actx.createGain(); o.connect(f).connect(g).connect(actx.destination); this.env(g, t, .25, .22); o.start(t); o.stop(t + .25); },
  reload() { if (!actx) return; [0, .45, 1.3, 1.6].forEach(dt => { const t = actx.currentTime + dt; const n = actx.createBufferSource(); n.buffer = nbuf; const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800 + Math.random() * 800; f.Q.value = 4; const g = actx.createGain(); n.connect(f).connect(g).connect(actx.destination); this.env(g, t, .2, .06); n.start(t); n.stop(t + .08); }); },
  throwG() { if (!actx) return; const t = actx.currentTime; const n = actx.createBufferSource(); n.buffer = nbuf; const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900; const g = actx.createGain(); n.connect(f).connect(g).connect(actx.destination); this.env(g, t, .15, .15); n.start(t); n.stop(t + .2); },
  boom(v = 1) { if (!actx) return; const t = actx.currentTime; const n = actx.createBufferSource(); n.buffer = nbuf; n.loop = true; const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(60, t + 1.2); const g = actx.createGain(); n.connect(f).connect(g).connect(actx.destination); this.env(g, t, .9 * v, 1.3); n.start(t); n.stop(t + 1.4);
    const o = actx.createOscillator(); o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(25, t + .8); const g2 = actx.createGain(); o.connect(g2).connect(actx.destination); this.env(g2, t, .8 * v, .9); o.start(t); o.stop(t + 1); },
  clear() { if (!actx) return; const t = actx.currentTime; [523, 659, 784, 1046].forEach((fr, i) => { const o = actx.createOscillator(); o.type = 'triangle'; o.frequency.value = fr; const g = actx.createGain(); o.connect(g).connect(actx.destination); this.env(g, t + i * .12, .15, .35); o.start(t + i * .12); o.stop(t + i * .12 + .4); }); },
};

// ============================================================
//  输入
// ============================================================
const mouse = { left: false, right: false };
addEventListener('keydown', e => {
  if (e.repeat) return; keys[e.code] = true;
  if (!running || paused) return;
  if (e.code === 'KeyR') reload();
  if (e.code === 'KeyC') P.crouch = !P.crouch;
  if (e.code === 'KeyF') { flashOn = !flashOn; flashlight.intensity = flashOn ? 260 : 0; }
  if (e.code === 'KeyT') setPreset((todIndex + 1) % PRESETS.length);
  if (e.code === 'KeyG') throwGrenade();
  if (e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.left = mouse.right = false; });
canvas.addEventListener('mousedown', e => { if (!running || paused) return; if (e.button === 0) mouse.left = true; if (e.button === 2) mouse.right = true; });
addEventListener('mouseup', e => { if (e.button === 0) mouse.left = false; if (e.button === 2) mouse.right = false; });
addEventListener('contextmenu', e => e.preventDefault());
let lockT = 0;
addEventListener('mousemove', e => {
  if (!locked || !running || paused || !P.alive) return;
  if (performance.now() - lockT < 80 || Math.abs(e.movementX) > 400 || Math.abs(e.movementY) > 400) return; // 忽略锁定瞬间的跳变
  const sens = .0021 * lerp(1, .55, G.ads);
  P.yaw -= e.movementX * sens; P.pitch = clamp(P.pitch - e.movementY * sens, -1.45, 1.45);
  swayX -= e.movementX * .00012; swayY += e.movementY * .00012;
});
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === canvas; lockT = performance.now();
  if (!locked && running && P.alive) { paused = true; $('menu').classList.remove('hide'); $('start').textContent = '继续任务'; $('hint').textContent = '任务已暂停'; mouse.left = mouse.right = false; }
});
$('start').addEventListener('click', async () => {
  if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); nbuf = noiseBuf(1.5); }
  if (actx.state === 'suspended') actx.resume();
  if (!running) { resetGame(); running = true; }
  paused = false; $('menu').classList.add('hide'); $('hud').classList.add('on');
  try { await canvas.requestPointerLock({ unadjustedMovement: true }); } catch { try { canvas.requestPointerLock(); } catch { } }
});

// ============================================================
//  主循环
// ============================================================
setPreset(0, true);
updateShadowCamera();
window.__fps = { P, G, state, enemies, setPreset, scene, renderer, get now() { return now; } };
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, clock.getDelta());
  now += dt;
  if (running && !paused) {
    updatePlayer(dt); updateGun(dt);
    for (const e of enemies.slice()) e.update(dt);
    updateWaves(dt); updateGrenades(dt);
    enemyFlash.intensity *= Math.exp(-dt * 30);
  }
  sparks.update(dt); dust.update(dt); blood.update(dt); casings.update(dt); fire.update(dt); smoke.update(dt); updateTracers(dt);
  updateLighting(dt); updateShadowCamera();

  // 相机
  P.recoil = lerp(P.recoil, 0, 1 - Math.exp(-dt * 9)); P.recoilX = lerp(P.recoilX, 0, 1 - Math.exp(-dt * 9));
  P.shake = Math.max(0, P.shake - dt * 2.2);
  const sh = P.shake * P.shake * .035;
  camera.position.set(P.pos.x, P.pos.y + P.eye + Math.sin(P.bob * 2) * .025 * Math.min(1, Math.hypot(P.hvel.x, P.hvel.z) / 5) * (P.onGround ? 1 : 0), P.pos.z);
  camera.rotation.set(P.pitch + P.recoil + (Math.random() - .5) * sh, P.yaw + P.recoilX + (Math.random() - .5) * sh, Math.sin(P.bob) * .006 * Math.min(1, Math.hypot(P.hvel.x, P.hvel.z) / 5) + (Math.random() - .5) * sh * .5);
  if (!P.alive) { camera.position.y = lerp(camera.position.y, P.pos.y + .4, .05); camera.rotation.z = lerp(camera.rotation.z, .5, .04); }
  sky.position.copy(camera.position);
  camera.updateMatrixWorld();
  gunCam.position.copy(camera.position); gunCam.quaternion.copy(camera.quaternion); gunCam.updateMatrixWorld();
  gunSun.position.copy(L.sunPos).normalize().multiplyScalar(10).add(camera.position); gunSun.target.position.copy(camera.position); gunSun.color.copy(L.sunColor); gunSun.intensity = L.sunI * .8;
  gunHemi.color.copy(L.hemiSky); gunHemi.groundColor.copy(L.hemiGround); gunHemi.intensity = L.hemiI + L.lamps * .25 + (flashOn ? .35 : 0);
  gunFill.intensity = .25 + L.sunI * .15 + (flashOn ? .5 : 0); gunFill.color.copy(L.sunColor).lerp(tmpC.set(0xffffff), .5);
  updateHUD(dt);
  renderer.autoClear = true; renderer.render(scene, camera);
  renderer.autoClear = false; renderer.clearDepth(); renderer.render(gunScene, gunCam);
}
frame();
</script>
