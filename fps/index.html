<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>暗影行动 · FPS</title>
<style>
  :root{
    --ink:#e8e6df;--dim:rgba(232,230,223,.55);--accent:#ffb347;--red:#ff3b30;--green:#7ee081;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    --gap:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;font-family:var(--sans);color:var(--ink);user-select:none;-webkit-user-select:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none}
  #hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .4s}
  #hud.on{opacity:1}

  /* 瞄准十字 */
  #cross{position:absolute;left:50%;top:50%;width:0;height:0}
  #cross i{position:absolute;background:#fff;box-shadow:0 0 2px #000,0 0 1px #000;transition:transform .06s}
  #cross .t,#cross .b{width:2px;height:9px;left:-1px}
  #cross .l,#cross .r{height:2px;width:9px;top:-1px}
  #cross .t{top:calc(-9px - var(--gap))}
  #cross .b{top:var(--gap)}
  #cross .l{left:calc(-9px - var(--gap))}
  #cross .r{left:var(--gap)}
  #cross .dot{width:2px;height:2px;left:-1px;top:-1px;border-radius:1px}
  #cross.ads i{opacity:0}
  #cross.ads .dot{opacity:1}
  #hit{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0}
  #hit i{position:absolute;left:50%;top:50%;width:2px;height:12px;margin:-6px 0 0 -1px;background:#fff;box-shadow:0 0 2px #000}
  #hit i:nth-child(1){transform:translate(-7px,-7px) rotate(45deg)}
  #hit i:nth-child(2){transform:translate(7px,-7px) rotate(-45deg)}
  #hit i:nth-child(3){transform:translate(-7px,7px) rotate(-45deg)}
  #hit i:nth-child(4){transform:translate(7px,7px) rotate(45deg)}
  #hit.kill i{background:var(--red)}

  /* 伤害与低血量 */
  #vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(140,0,0,.9) 100%);opacity:0}
  #dmg{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,40,20,.0) 30%,rgba(255,40,20,.55) 100%);opacity:0}
  #flash{position:absolute;inset:0;background:#fff;opacity:0}

  /* 罗盘 */
  #compass{position:absolute;top:18px;left:50%;width:420px;margin-left:-210px;height:34px;overflow:hidden;background:rgba(0,0,0,.28);
    mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}
  #strip{position:absolute;top:0;left:0;height:100%;white-space:nowrap}
  #strip span{position:absolute;top:4px;font:12px var(--mono);color:var(--dim);transform:translateX(-50%)}
  #strip span.cd{color:var(--ink);font-weight:700;font-size:14px;top:2px}
  #strip b{position:absolute;top:22px;width:1px;height:6px;background:var(--dim)}
  #strip b.big{height:10px;top:20px;background:var(--ink)}
  #compass .pin{position:absolute;left:50%;bottom:0;width:0;height:0;border:5px solid transparent;border-bottom-color:var(--accent);margin-left:-5px}
  #enemies{position:absolute;top:56px;left:50%;transform:translateX(-50%);font:11px var(--mono);color:var(--dim);letter-spacing:.2em}

  /* 左上信息 */
  #tl{position:absolute;left:28px;top:24px;font:13px var(--mono);line-height:1.8;text-shadow:0 1px 2px #000}
  #tl .wave{font:700 22px var(--sans);letter-spacing:.08em;color:var(--accent)}
  #tl .lbl{color:var(--dim)}
  /* 击杀记录 */
  #feed{position:absolute;right:28px;top:60px;text-align:right;font:13px var(--mono);text-shadow:0 1px 2px #000}
  #feed div{opacity:0;animation:feed 4s forwards;margin-bottom:4px}
  #feed div em{color:var(--accent);font-style:normal}
  @keyframes feed{0%{opacity:0;transform:translateX(12px)}8%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
  #fps{position:absolute;right:28px;top:24px;font:11px var(--mono);color:var(--dim)}

  /* 左下 生命 */
  #bl{position:absolute;left:28px;bottom:28px;text-shadow:0 1px 2px #000}
  #hpbar{width:240px;height:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);position:relative;overflow:hidden}
  #hpfill{height:100%;width:100%;background:linear-gradient(90deg,#9fe3a2,#4ec25a);transition:width .15s,background .3s}
  #hpfill.low{background:linear-gradient(90deg,#ff7b6e,#e3261a)}
  #hptxt{font:700 26px var(--mono);margin-top:6px;letter-spacing:.05em}
  #hptxt small{font-size:12px;color:var(--dim);margin-left:6px;font-weight:400}
  #gren{font:14px var(--mono);color:var(--dim);margin-top:4px}
  #gren b{color:var(--accent);letter-spacing:.2em}

  /* 右下 弹药 */
  #br{position:absolute;right:28px;bottom:28px;text-align:right;text-shadow:0 1px 2px #000}
  #ammo{font:700 46px var(--mono);line-height:1;letter-spacing:-.02em}
  #ammo small{font-size:18px;color:var(--dim);font-weight:400}
  #ammo.low{color:var(--red)}
  #wname{font:13px var(--sans);color:var(--dim);letter-spacing:.2em;margin-top:6px}
  #keys{font:11px var(--mono);color:var(--dim);margin-top:6px;opacity:.7}

  /* 中央横幅与提示 */
  #banner{position:absolute;left:0;right:0;top:30%;text-align:center;font:700 40px var(--sans);letter-spacing:.3em;color:var(--accent);text-shadow:0 2px 12px #000;opacity:0;transition:opacity .4s}
  #banner small{display:block;font:13px var(--mono);letter-spacing:.3em;color:var(--dim);margin-top:8px}
  #prompt{position:absolute;left:0;right:0;top:58%;text-align:center;font:700 15px var(--mono);letter-spacing:.2em;color:var(--accent);text-shadow:0 1px 3px #000;opacity:0}
  #prompt.on{opacity:1}
  #reloadbar{position:absolute;left:50%;top:calc(50% + 26px);width:60px;height:3px;margin-left:-30px;background:rgba(255,255,255,.15);display:none}
  #reloadbar i{display:block;height:100%;background:#fff;width:0}

  /* 菜单 */
  #menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:20px 0;background:radial-gradient(ellipse at 50% 40%,rgba(30,34,44,.55),rgba(0,0,0,.92));backdrop-filter:blur(2px);z-index:10;transition:opacity .4s}
  #menu.hide{opacity:0;pointer-events:none}
  .card{width:min(560px,92vw);margin:auto;padding:40px 44px;border:1px solid rgba(255,255,255,.1);background:rgba(10,12,16,.75);box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .card h1{font:800 42px var(--sans);letter-spacing:.25em;margin-bottom:4px}
  .card .sub{font:12px var(--mono);letter-spacing:.3em;color:var(--accent);margin-bottom:28px}
  .card p.desc{font:14px/1.7 var(--sans);color:var(--dim);margin-bottom:22px}
  .keys{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px;font:13px var(--mono);color:var(--dim);margin-bottom:28px}
  .keys b{display:inline-block;min-width:74px;color:var(--ink);font-weight:600}
  .btn{pointer-events:auto;cursor:pointer;font:700 15px var(--sans);letter-spacing:.3em;padding:14px 28px;border:1px solid var(--accent);background:var(--accent);color:#1a1200;transition:transform .1s,background .2s}
  .btn:hover{background:#ffc66b;transform:translateY(-1px)}
  .btn.ghost{background:transparent;color:var(--accent);margin-left:12px}
  .hint{font:11px var(--mono);color:var(--dim);margin-top:18px}
  #stats{font:14px var(--mono);line-height:2;color:var(--dim);margin-bottom:24px}
  #stats b{color:var(--ink)}
  #err{color:#ff8a80;font:13px var(--mono);margin-top:14px;display:none}
  @media (max-width:640px){#compass{width:260px;margin-left:-130px}#ammo{font-size:34px}.card{padding:28px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="vig"></div><div id="dmg"></div><div id="flash"></div>
  <div id="compass"><div id="strip"></div><div class="pin"></div></div>
  <div id="enemies">敌军 0</div>
  <div id="cross"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="dot"></i></div>
  <div id="hit"><i></i><i></i><i></i><i></i></div>
  <div id="reloadbar"><i></i></div>
  <div id="tl"><div class="wave">第 1 波</div><div><span class="lbl">分数 </span><span id="score">0</span></div><div><span class="lbl">击杀 </span><span id="kills">0</span></div><div><span class="lbl">光照 </span><span id="tod">正午</span></div></div>
  <div id="fps"></div>
  <div id="feed"></div>
  <div id="bl"><div id="hpbar"><div id="hpfill"></div></div><div id="hptxt">100<small>HP</small></div><div id="gren">手雷 <b>●●●</b></div></div>
  <div id="br"><div id="ammo"><span id="mag">30</span> <small>/ <span id="res">120</span></small></div><div id="wname">M4A1 · 全自动</div><div id="keys">[F] 手电 &nbsp;[T] 时间 &nbsp;[G] 手雷 &nbsp;[R] 装弹</div></div>
  <div id="banner"></div>
  <div id="prompt"></div>
</div>

<div id="menu">
  <div class="card">
    <h1>暗影行动</h1>
    <div class="sub">SHADOW OPS · 第一人称射击演示</div>
    <p class="desc" id="desc">实时阴影 · 动态昼夜光照 · 枪口闪光投影 · 战术手电 · 波次敌军 AI。<br>守住补给站，尽可能多地击退来袭敌军。</p>
    <div id="stats" style="display:none"></div>
    <div class="keys">
      <div><b>W A S D</b> 移动</div><div><b>鼠标</b> 视角</div>
      <div><b>左键</b> 射击</div><div><b>右键</b> 机瞄</div>
      <div><b>Shift</b> 冲刺</div><div><b>空格</b> 跳跃</div>
      <div><b>C</b> 蹲下</div><div><b>R</b> 装弹</div>
      <div><b>G</b> 手雷</div><div><b>F</b> 手电</div>
      <div><b>T</b> 切换时间</div><div><b>Esc</b> 暂停</div>
    </div>
    <button class="btn" id="start">开始任务</button>
    <p class="hint" id="hint">点击后锁定鼠标指针，按 Esc 暂停</p>
    <div id="err"></div>
  </div>
</div>

<script type="importmap">

<script type="module">
let THREE;
try { THREE = await import('three'); }
catch (e) {
  const el = document.getElementById('err'); el.style.display = 'block';
  el.textContent = '无法加载 Three.js（需要网络访问 cdnjs.cloudflare.com）：' + e.message;
  document.getElementById('start').disabled = true;
  throw e;
}

// ============================================================
//  基础渲染
// ============================================================
const $ = id => document.getElementById(id);
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xb9cfe3, 0.006);
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 420);
camera.rotation.order = 'YXZ';
scene.add(camera);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

// ============================================================
//  程序化 PBR 贴图（颜色 / 法线 / 粗糙度，全部可平铺）
// ============================================================
function mkCanvas(w, h = w) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function noiseTile(cells) {
  const [c, g] = mkCanvas(cells * 2); const img = g.createImageData(cells, cells);
  for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0); g.putImageData(img, cells, 0); g.putImageData(img, 0, cells); g.putImageData(img, cells, cells); return c;
}
// 多倍频平滑噪声（两级放大消除格子感，源图四联拼保证无缝）
function fbm(g, w, h, { octaves = [6, 12, 24, 48], alpha = .5, blend = 'overlay', falloff = .6 } = {}) {
  g.save(); g.globalCompositeOperation = blend; g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  let a = alpha;
  for (const cells of octaves) {
    const t = noiseTile(cells); const [mid, mg] = mkCanvas(cells * 8); mg.imageSmoothingEnabled = true; mg.imageSmoothingQuality = 'high';
    mg.drawImage(t, cells / 2, cells / 2, cells, cells, 0, 0, cells * 8, cells * 8);
    g.globalAlpha = a; g.drawImage(mid, 0, 0, w, h); a *= falloff;
  }
  g.restore();
}
function speckle(g, w, h, n, lo, hi, size = 1.5, alpha = 1) {
  g.save(); g.globalAlpha = alpha;
  for (let i = 0; i < n; i++) { const v = (lo + Math.random() * (hi - lo)) | 0; g.fillStyle = `rgb(${v},${v},${v})`; const r = size * (.5 + Math.random()); g.fillRect(Math.random() * w, Math.random() * h, r, r); }
  g.restore();
}
// 同一条裂缝路径画到多个画布（颜色 / 高度 / 粗糙度保持一致）
function cracks(targets, w, h, n, seg = 14, step = 26) {
  for (let i = 0; i < n; i++) {
    const pts = []; let x = w * (.15 + Math.random() * .7), y = h * (.15 + Math.random() * .7), a = Math.random() * 6.28;
    for (let k = 0; k < seg; k++) { pts.push([x, y]); a += (Math.random() - .5) * 1.5; x = clamp(x + Math.cos(a) * step * (.4 + Math.random()), 2, w - 2); y = clamp(y + Math.sin(a) * step * (.4 + Math.random()), 2, h - 2); }
    for (const [g, color, width] of targets) {
      g.strokeStyle = color; g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = width * (.7 + Math.random() * .6);
      g.beginPath(); pts.forEach(([px, py], j) => j ? g.lineTo(px, py) : g.moveTo(px, py)); g.stroke();
    }
  }
}
function blob(g, x, y, r, color, jag = .35) {
  g.fillStyle = color; g.beginPath();
  for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2, rr = r * (1 - jag + Math.random() * jag * 2); const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr; i ? g.lineTo(px, py) : g.moveTo(px, py); }
  g.closePath(); g.fill();
}
function radial(g, x, y, r, c0, c1) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, c0); gr.addColorStop(1, c1); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
function weave(g, w, h, step, light, dark) {
  for (let i = 0; i < w; i += step) { g.fillStyle = (i / step) % 2 ? light : dark; g.fillRect(i, 0, 1, h); }
  for (let j = 0; j < h; j += step) { g.fillStyle = (j / step) % 2 ? light : dark; g.fillRect(0, j, w, 1); }
}
function normalFromHeight(hc, strength) {
  const w = hc.width, h = hc.height, d = hc.getContext('2d').getImageData(0, 0, w, h).data;
  const [c, g] = mkCanvas(w, h), out = g.createImageData(w, h), o = out.data;
  const H = (x, y) => d[(((y + h) % h) * w + ((x + w) % w)) * 4] / 255;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const dx = (H(x + 1, y) - H(x - 1, y)) * strength, dy = (H(x, y + 1) - H(x, y - 1)) * strength;
    const il = 1 / Math.hypot(dx, dy, 1), i = (y * w + x) * 4;
    o[i] = (-dx * il * .5 + .5) * 255; o[i + 1] = (dy * il * .5 + .5) * 255; o[i + 2] = (il * .5 + .5) * 255; o[i + 3] = 255;
  }
  g.putImageData(out, 0, 0); return c;
}
const SETS = {}, TEX = {};
function makeSet(name, w, h, tile, fn, { normalScale = 1, metalness = 0, strength = 2.5 } = {}) {
  const [cc, c] = mkCanvas(w, h), [hc, hg] = mkCanvas(w, h), [rc, rg] = mkCanvas(w, h);
  hg.fillStyle = '#808080'; hg.fillRect(0, 0, w, h); rg.fillStyle = '#f0f0f0'; rg.fillRect(0, 0, w, h);
  fn(c, hg, rg, w, h);
  const T = cv => { const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t; };
  const map = T(cc); map.colorSpace = THREE.SRGBColorSpace;
  SETS[name] = { map, normalMap: T(normalFromHeight(hc, strength)), roughnessMap: T(rc), normalScale, metalness, tile: Array.isArray(tile) ? tile : [tile, tile] };
}
const hsl = (h, s, l) => `hsl(${h},${s}%,${l}%)`;

// —— 沥青（4m）——
makeSet('asphalt', 512, 512, 4, (c, hg, rg, w, h) => {
  c.fillStyle = '#353533'; c.fillRect(0, 0, w, h); fbm(c, w, h, { alpha: .3 });
  speckle(c, w, h, 30000, 25, 120, 1.4, .85); speckle(hg, w, h, 14000, 95, 165, 1.4, .9);
  for (let i = 0; i < 3; i++) { const v = 40 + rnd(40) | 0; c.fillStyle = `rgba(${v},${v},${v},.35)`; const x = rnd(w), y = rnd(h), pw = rnd(90, 200), ph = rnd(60, 160); c.fillRect(x, y, pw, ph); hg.fillStyle = 'rgba(140,140,140,.5)'; hg.fillRect(x, y, pw, ph); }
  for (let i = 0; i < 4; i++) { const x = rnd(w), y = rnd(h), r = rnd(30, 90); radial(c, x, y, r, 'rgba(8,8,10,.75)', 'rgba(8,8,10,0)'); radial(rg, x, y, r, 'rgba(70,70,70,.9)', 'rgba(70,70,70,0)'); }
  cracks([[c, 'rgba(12,12,12,.8)', 2.2], [hg, 'rgba(40,40,40,.9)', 2.6], [rg, 'rgba(255,255,255,.6)', 2.2]], w, h, 7);
  fbm(rg, w, h, { alpha: .25, blend: 'source-over' });
});
// —— 混凝土（2m）——
makeSet('concrete', 512, 512, 2, (c, hg, rg, w, h) => {
  c.fillStyle = '#6e6c66'; c.fillRect(0, 0, w, h); fbm(c, w, h, { alpha: .22 }); fbm(c, w, h, { alpha: .3, blend: 'multiply', octaves: [4, 8] });
  speckle(c, w, h, 9000, 70, 160, 1.2, .5); speckle(hg, w, h, 5000, 115, 145, 1.2, .8);
  // 模板拼缝 + 对拉螺栓孔
  for (const t of [[c, 'rgba(35,35,35,.75)', 5], [hg, '#454545', 5], [rg, '#ffffff', 5]]) { const [g, col, lw] = t; g.strokeStyle = col; g.lineWidth = lw; g.beginPath(); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.moveTo(w / 2, 0); g.lineTo(w / 2, h); g.moveTo(0, 1); g.lineTo(w, 1); g.moveTo(1, 0); g.lineTo(1, h); g.stroke(); }
  for (const px of [0, w / 2]) for (const py of [0, h / 2]) for (const [ox, oy] of [[w / 8, h / 8], [3 * w / 8, h / 8], [w / 8, 3 * h / 8], [3 * w / 8, 3 * h / 8]]) {
    const x = px + ox, y = py + oy; radial(c, x, y, 9, 'rgba(45,45,45,.9)', 'rgba(45,45,45,0)'); radial(hg, x, y, 8, '#3a3a3a', 'rgba(58,58,58,0)');
    c.fillStyle = 'rgba(255,255,255,.12)'; c.beginPath(); c.arc(x, y + 2, 7, 0, 7); c.fill();
    if (Math.random() < .5) { const gr = c.createLinearGradient(0, y, 0, y + rnd(40, 120)); gr.addColorStop(0, 'rgba(40,38,34,.45)'); gr.addColorStop(1, 'rgba(40,38,34,0)'); c.fillStyle = gr; c.fillRect(x - 5, y, 10, 120); }
  }

function collides(pos, radius, height) {
  const step = pos.y + .5;

}

}

  const sh = P.shake * P.shake * .035;
  camera.position.set(P.pos.x, P.pos.y + P.eye + Math.sin(P.bob * 2) * .025 * Math.min(1, Math.hypot(P.hvel.x, P.hvel.z) / 5) * (P.onGround ? 1 : 0), P.pos.z);
  camera.rotation.set(P.pitch + P.recoil + (Math.random() - .5) * sh, P.yaw + P.recoilX + (Math.random() - .5) * sh, Math.sin(P.bob) * .006 * Math.min(1, Math.hypot(P.hvel.x, P.hvel.z) / 5) + (Math.random() - .5) * sh * .5);
  if (!P.alive) { camera.position.y = lerp(camera.position.y, P.pos.y + .4, .05); camera.rotation.z = lerp(camera.rotation.z, .5, .04); }
  sky.position.copy(camera.position);
  camera.updateMatrixWorld();
  gunCam.position.copy(camera.position); gunCam.quaternion.copy(camera.quaternion); gunCam.updateMatrixWorld();
  gunSun.position.copy(L.sunPos).normalize().multiplyScalar(10).add(camera.position); gunSun.target.position.copy(camera.position); gunSun.color.copy(L.sunColor); gunSun.intensity = L.sunI * .8;
  gunHemi.color.copy(L.hemiSky); gunHemi.groundColor.copy(L.hemiGround); gunHemi.intensity = L.hemiI + L.lamps * .25 + (flashOn ? .35 : 0);
  gunFill.intensity = .25 + L.sunI * .15 + (flashOn ? .5 : 0); gunFill.color.copy(L.sunColor).lerp(tmpC.set(0xffffff), .5);
  updateHUD(dt);
  renderer.autoClear = true; renderer.render(scene, camera);
  renderer.autoClear = false; renderer.clearDepth(); renderer.render(gunScene, gunCam);
}
frame();
</script>
